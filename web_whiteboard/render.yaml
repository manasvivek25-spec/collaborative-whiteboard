services:
  - type: web
    name: collaborative-whiteboard
    env: node
    plan: free
    buildCommand: npm run install-all && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: PORT
        value: 5000

